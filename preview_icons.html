<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #e0f2fe; font-family: sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 40px; justify-content: center; }
        .icon-card { 
            background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100px;
        }
        .icon-name { font-size: 12px; color: #64748b; font-weight: bold; }
        svg { background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="2" y="5" width="12" height="9" fill="#8B4513"/>
            <rect x="3" y="14" width="10" height="1" fill="#5D2E0C"/>
            <rect x="2" y="4" width="12" height="1" fill="#D2B48C"/>
            <rect x="6" y="2" width="4" height="2" fill="#D2B48C"/>
            <rect x="7" y="6" width="2" height="2" fill="#FFD700"/>
        </svg>
        <span class="icon-name">Backpack</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="2" y="2" width="12" height="12" fill="#3B82F6"/>
            <rect x="3" y="3" width="10" height="10" fill="#60A5FA"/>
            <rect x="4" y="4" width="8" height="1" fill="#EFF6FF"/>
            <rect x="4" y="6" width="8" height="1" fill="#EFF6FF"/>
            <rect x="4" y="8" width="8" height="1" fill="#EFF6FF"/>
            <rect x="13" y="3" width="1" height="10" fill="#1D4ED8"/>
        </svg>
        <span class="icon-name">Dex</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="2" y="1" width="12" height="14" fill="#E2E8F0"/>
            <rect x="3" y="2" width="10" height="12" fill="#F8FAF8"/>
            <rect x="6" y="0" width="4" height="2" fill="#64748B"/>
            <rect x="5" y="5" width="6" height="1" fill="#22C55E"/>
            <rect x="5" y="8" width="6" height="1" fill="#22C55E"/>
            <rect x="5" y="11" width="4" height="1" fill="#22C55E"/>
        </svg>
        <span class="icon-name">History</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="2" y="5" width="4" height="6" fill="#6366F1"/>
            <path d="M6 5 L10 1 L10 15 L6 11 Z" fill="#4F46E5"/>
            <rect x="12" y="6" width="1" height="4" fill="#818CF8"/>
            <rect x="14" y="4" width="1" height="8" fill="#A5B4FC"/>
        </svg>
        <span class="icon-name">Mute</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="6" y="2" width="4" height="12" fill="#64748B"/>
            <rect x="2" y="6" width="12" height="4" fill="#64748B"/>
            <rect x="4" y="4" width="8" height="8" fill="#64748B"/>
            <rect x="6" y="6" width="4" height="4" fill="#1E293B"/>
            <rect x="7" y="7" width="2" height="2" fill="#334155"/>
        </svg>
        <span class="icon-name">Settings</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="3" y="4" width="10" height="10" fill="#EF4444"/>
            <rect x="2" y="2" width="12" height="2" fill="#DC2626"/>
            <rect x="6" y="1" width="4" height="1" fill="#DC2626"/>
            <rect x="5" y="6" width="1" height="6" fill="#FCA5A5"/>
            <rect x="8" y="6" width="1" height="6" fill="#FCA5A5"/>
            <rect x="10" y="6" width="1" height="6" fill="#FCA5A5"/>
        </svg>
        <span class="icon-name">Trash</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="4" y="2" width="8" height="12" rx="4" fill="#FFFFFF"/>
            <rect x="5" y="3" width="6" height="10" rx="3" fill="#F8FAFC"/>
            <rect x="6" y="5" width="2" height="2" fill="#F1F5F9"/>
            <path d="M4 8 Q 8 10 12 8" stroke="#E2E8F0" fill="none" stroke-width="1"/>
        </svg>
        <span class="icon-name">Relive Egg</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="2" y="2" width="12" height="12" rx="2" fill="#6366F1"/>
            <rect x="7" y="4" width="2" height="8" fill="#FFFFFF"/>
            <rect x="4" y="7" width="8" height="2" fill="#FFFFFF"/>
        </svg>
        <span class="icon-name">Add Task</span>
    </div>

    <!-- Categories -->
    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="2" y="2" width="12" height="12" fill="#F472B6"/>
            <rect x="4" y="4" width="3" height="3" fill="#FB923C"/>
            <rect x="9" y="4" width="3" height="3" fill="#60A5FA"/>
            <rect x="4" y="9" width="3" height="3" fill="#4ADE80"/>
            <rect x="9" y="9" width="3" height="3" fill="#FACC15"/>
        </svg>
        <span class="icon-name">Creative</span>
    </div>

    <div class="icon-card">
        <svg viewBox="0 0 16 16" width="64" height="64" style="image-rendering:pixelated;">
            <rect x="4" y="10" width="8" height="4" fill="#64748B"/>
            <rect x="7" y="2" width="2" height="10" fill="#94A3B8"/>
            <rect x="3" y="4" width="3" height="6" fill="#64748B"/>
            <rect x="10" y="4" width="3" height="6" fill="#64748B"/>
        </svg>
        <span class="icon-name">Physical</span>
    </div>
</body>
</html>
