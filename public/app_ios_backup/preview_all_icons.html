<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Monster - Rich & Pop Icon Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-color: #6366f1;
            --text-color: #f1f5f9;
        }
        body {
            font-family: 'Outfit', 'DotGothic16', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
            letter-spacing: -0.5px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 25px;
            color: #818cf8;
            border-bottom: 1px solid rgba(129, 140, 248, 0.2);
            padding-bottom: 10px;
        }
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 20px;
        }
        .icon-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 15px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .icon-card:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(129, 140, 248, 0.3);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.2);
        }
        .icon-card span {
            font-size: 10px;
            margin-top: 12px;
            text-align: center;
            opacity: 0.7;
            word-break: break-all;
            font-family: 'Outfit', sans-serif;
        }
        .icon-wrapper {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        svg {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        .rarity-super_rare {
            background: linear-gradient(135deg, rgba(192, 38, 211, 0.1), rgba(99, 102, 241, 0.1));
            border-color: rgba(192, 38, 211, 0.3);
        }
    </style>
</head>
<body>
    <h1>✨ Rich & Pop Icon Gallery ✨</h1>
    
    <div class="container">
        <!-- UI & Common Icons -->
        <div class="section">
            <h2>Common / UI Actions</h2>
            <div id="common-icons" class="icon-grid"></div>
        </div>

        <!-- Materials -->
        <div class="section">
            <h2>Evolution Materials</h2>
            <div id="material-icons" class="icon-grid"></div>
        </div>

        <!-- Background Themes -->
        <div class="section">
            <h2>Background Themes</h2>
            <div id="background-icons" class="icon-grid"></div>
        </div>

        <!-- Furniture -->
        <div class="section">
            <h2>Furniture Items</h2>
            <div id="furniture-icons" class="icon-grid"></div>
        </div>
    </div>

    <script type="module">
        import { PIXEL_ICONS } from './src/icons.js';
        import { ITEMS } from './src/items.js';

        // Render PIXEL_ICONS
        const commonGrid = document.getElementById('common-icons');
        for (const [id, svg] of Object.entries(PIXEL_ICONS)) {
            const card = document.createElement('div');
            card.className = 'icon-card';
            card.innerHTML = `
                <div class="icon-wrapper">${svg}</div>
                <span>${id}</span>
            `;
            commonGrid.appendChild(card);
        }

        // Render ITEMS
        const materialGrid = document.getElementById('material-icons');
        const backgroundGrid = document.getElementById('background-icons');
        const furnitureGrid = document.getElementById('furniture-icons');

        for (const [id, item] of Object.entries(ITEMS)) {
            const card = document.createElement('div');
            card.className = 'icon-card' + (item.rarity === 'super_rare' ? ' rarity-super_rare' : '');
            card.innerHTML = `
                <div class="icon-wrapper">${item.icon}</div>
                <span>${item.name}</span>
            `;
            
            if (item.type === 'material') materialGrid.appendChild(card);
            else if (item.type === 'background') backgroundGrid.appendChild(card);
            else if (item.type === 'furniture') furnitureGrid.appendChild(card);
        }
    </script>
</body>
</html>
